# Release pipeline (GitHub Actions).
#
# Two ways to start a release:
#   - On GitHub: Actions tab > Release > "Run workflow", type a version (1.1.0).
#   - From a terminal: git tag v1.1.0 && git push origin v1.1.0
#
# It runs the server tests, stamps the version into the add-on, zips it into
# anki_clicker.ankiaddon, and publishes a GitHub Release with that file
# attached. Friends' add-ons check for that release when Anki starts.
#
# If the tests fail, nothing is published: a broken version can't reach anyone.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1.0"
        required: true

env:
  # The tag this release gets: from the button's input, or the pushed tag.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write   # needed to create the release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server tests
        working-directory: server
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Add-on code compiles
        run: python -m py_compile addon/anki_clicker/*.py

  addon:
    # Load and exercise the add-on on the oldest and newest Python that Anki
    # ships. Anki 25.02 uses Python 3.9 and 25.09 uses 3.13; v1.0.2 broke on
    # 3.9 because nothing tested it. Now nothing ships unless both pass.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Add-on smoke test on Python ${{ matrix.python }}
        run: python addon/tests/smoke_test.py

  release:
    needs: [test, addon]   # only runs if every test passed on every Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from the tag
        run: |
          VERSION="${TAG#v}"                      # v1.1.0 -> 1.1.0
          # Refuse anything that isn't a plain version number.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          python - <<EOF
          import json
          p = "addon/anki_clicker/manifest.json"
          m = json.load(open(p))
          m["human_version"] = "$VERSION"
          json.dump(m, open(p, "w"), indent=4)
          EOF
          cat addon/anki_clicker/manifest.json

      - name: Build anki_clicker.ankiaddon
        run: |
          cd addon/anki_clicker
          # An .ankiaddon is just a zip of the add-on folder's contents.
          # Never include anyone's data, settings, or caches.
          zip -r ../../anki_clicker.ankiaddon . -x "user_files/*" "meta.json" "__pycache__/*" "*/__pycache__/*"
          cd ../..
          unzip -l anki_clicker.ankiaddon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag too (at this exact commit) if it doesn't exist yet.
          gh release create "$TAG" anki_clicker.ankiaddon \
            --target "$GITHUB_SHA" \
            --title "Anki Clicker $TAG" \
            --generate-notes
